name: Feature request / Предложение
description: Suggest an improvement to the program or its documentation.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Задача
      description: What are you trying to do, and what is difficult now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested change / Предложение
      description: Describe the behavior you would like, and any alternatives.
    validations:
      required: true
